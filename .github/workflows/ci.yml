name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Prefer repo secret when set; dummy key is enough for build (pages soft-fail Last.fm 403)
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || 'ci-dummy-lastfm-api-key' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-session-secret-must-be-at-least-32-chars' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
